services:
  postgres:
    image: postgres:17-alpine
    container_name: mono-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mono
      POSTGRES_USER: mono
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mono -d mono"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: